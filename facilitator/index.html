<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Facilitator Dashboard…</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(2,6,23,.08);max-width:440px}
h1{font-size:20px;margin:0 0 10px;color:#0A2240}p{font-size:14px;line-height:1.6;margin:0;color:#64748B}a{color:#0F6E56;font-weight:700}
</style>
<script>
(function(){
  var candidates=['../facilitator.html','./facilitator.html','/facilitator.html'];
  var tail=window.location.search+window.location.hash;

  function go(to){
    var url=new URL(to, window.location.href);
    window.location.replace(url.href+tail);
  }

  function canLoad(to){
    var url=new URL(to, window.location.href);
    return fetch(url.href,{method:'HEAD',cache:'no-store'})
      .then(function(r){ return !!(r && r.ok); })
      .catch(function(){ return false; });
  }

  (function tryNext(i){
    if(i>=candidates.length){ go('../facilitator.html'); return; }
    canLoad(candidates[i]).then(function(ok){
      if(ok) go(candidates[i]);
      else tryNext(i+1);
    });
  }(0));
}());
</script>
</head>
<body>
  <main class="card">
    <h1>Opening Facilitator Dashboard…</h1>
    <p>If you are not redirected automatically, <a href="../facilitator.html">open the facilitator dashboard</a>.</p>
  </main>
</body>
</html>
